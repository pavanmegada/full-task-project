{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">
            <h3 class="mb-3">➕ Add New Task</h3>

            <form method="POST">

                <input type="text" name="title" class="form-control mb-3" placeholder="Task Title" required>

                <textarea name="description" class="form-control mb-3" placeholder="Description"></textarea>

                <input type="date" name="deadline" class="form-control mb-3" required>

                <select name="subject_id" class="form-control mb-3">
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>

                <button class="btn btn-primary w-100">Add Task</button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
